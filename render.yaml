services:
  - type: web
    name: aos-security-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: VERIFIED_ROLE_ID
        sync: false
      - key: UNVERIFIED_ROLE_ID
        sync: false
      - key: VERIFICATION_CHANNEL_ID
        value: 1546265698412794037
      - key: SECURITY_LOG_CHANNEL_ID
        sync: false
      - key: WHITELIST_USER_IDS
        sync: false
